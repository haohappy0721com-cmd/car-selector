<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌选车 — 找到你的理想座驾</title>
<style>
:root {
  --bg: #06080d;
  --surface: #0d1117;
  --surface2: #161b22;
  --border: #21262d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #00a6ff;
  --accent2: #7c3aed;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --glow: 0 0 20px rgba(0,166,255,.15);
  --glow-strong: 0 0 40px rgba(0,166,255,.25);
  --glass: rgba(22,27,34,.8);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(0,166,255,.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(124,58,237,.03) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(0,166,255,.02) 0%, transparent 40%);
}

/* Hero */
.hero {
  position: relative; overflow: hidden; text-align: center;
  padding: 80px 24px 56px;
  background: linear-gradient(180deg, rgba(0,166,255,.06) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.hero::before {
  content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,166,255,.02) 2px, rgba(0,166,255,.02) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,166,255,.02) 2px, rgba(0,166,255,.02) 4px);
  animation: gridMove 20s linear infinite; pointer-events: none;
}
@keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(40px,40px); } }
.hero h1 {
  font-size: clamp(32px, 6vw, 56px); font-weight: 900; position: relative; z-index: 1;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: -.02em;
}
.hero p { font-size: 16px; color: var(--muted); margin-top: 8px; position: relative; z-index: 1; }
.hero-stats { display: flex; gap: 40px; justify-content: center; margin-top: 28px; position: relative; z-index: 1; }
.hstat { text-align: center; }
.hstat-val { font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hstat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .1em; }

/* Search */
.search-wrap { max-width: 520px; margin: -22px auto 0; padding: 0 24px; position: relative; z-index: 20; }
.search-box {
  width: 100%; padding: 15px 20px 15px 50px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 15px; outline: none;
  box-shadow: var(--glow); transition: all .3s;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus { border-color: var(--accent); box-shadow: var(--glow-strong); }
.search-icon-svg { position: absolute; left: 40px; top: 15px; color: var(--muted); pointer-events: none; }

/* Sticky bar */
.sticky-bar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(6,8,13,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 14px 24px;
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
}

/* 筛选按钮 */
.fgroup { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.flabel { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
.fbtn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
  transition: all .2s; white-space: nowrap; font-weight: 500;
}
.fbtn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,166,255,.06); }
.fbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 16px rgba(0,166,255,.3); }

/* Sort */
.sort-row { max-width: 1360px; margin: 0 auto; padding: 12px 24px 4px; display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
.sort-row .count { font-size: 12px; color: var(--muted); margin-right: auto; }
.sort-row .count span { color: var(--accent); font-weight: 700; }
.sbtn { font-size: 11px; padding: 6px 12px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; font-weight: 500; }
.sbtn:hover { background: var(--surface2); }
.sbtn.on { color: var(--accent); border-color: var(--border); background: var(--surface2); }

/* Grid */
.main-wrap { max-width: 1360px; margin: 0 auto; padding: 0 24px 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  overflow: hidden; cursor: pointer; transition: all .3s cubic-bezier(.34,1.56,.64,1);
  position: relative; animation: cardIn .5s ease both;
}
.card:nth-child(1){animation-delay:0s}.card:nth-child(2){animation-delay:.03s}.card:nth-child(3){animation-delay:.06s}
.card:nth-child(4){animation-delay:.09s}.card:nth-child(5){animation-delay:.12s}.card:nth-child(6){animation-delay:.15s}
.card:nth-child(7){animation-delay:.18s}.card:nth-child(8){animation-delay:.21s}
@keyframes cardIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: var(--glow-strong); }

/* Card header with brand logo */
.card-header {
  height: 160px; position: relative; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-header .bg-pattern {
  position: absolute; inset: 0; opacity: .08;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,.5) 10px, rgba(255,255,255,.5) 11px),
    repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,.3) 10px, rgba(255,255,255,.3) 11px);
}
.card-header .card-img-bg {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: transform .6s; opacity: .6;
}
.card:hover .card-header .card-img-bg { transform: scale(1.08); opacity: .8; }
.card-header .card-img-bg.fallback { opacity: .15; background-size: auto; }
.card-header .logo-placeholder {
  position: relative; z-index: 1; width: 80px; height: 80px;
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 900; color: #fff;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  transition: transform .3s;
}
.card:hover .card-header .logo-placeholder { transform: scale(1.08); }
.card-header .country-chip {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.5); color: rgba(255,255,255,.8);
  backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.1);
}

.card-body { padding: 16px 18px 18px; }
.card-body .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-body h3 { font-size: 17px; font-weight: 700; }
.card-body .en-name { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card-body .price-line { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.card-body .model-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.mchip { padding: 3px 8px; border-radius: 6px; font-size: 10px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.card-body .type-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.ttag { padding: 3px 9px; border-radius: 6px; font-size: 10px; font-weight: 600; }
.ttag.ev { background: rgba(63,185,80,.15); color: var(--green); }
.ttag.sedan { background: rgba(0,166,255,.12); color: var(--accent); }
.ttag.suv { background: rgba(210,153,34,.15); color: var(--orange); }
.ttag.perf { background: rgba(248,81,73,.15); color: var(--red); }
.ttag.pickup { background: rgba(139,148,158,.15); color: var(--muted); }

/* Modal */
.modal-overlay {
  position: fixed; inset:0; background: rgba(0,0,0,.75); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;
  backdrop-filter: blur(10px);
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
  max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto;
  animation: modIn .3s ease; box-shadow: 0 0 60px rgba(0,166,255,.1);
}
@keyframes modIn { from{opacity:0;transform:scale(.94) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
.modal .m-hero {
  height: 220px; position: relative; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.modal .m-hero .m-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .55; }
.modal .m-hero .m-logo {
  position: relative; z-index: 1; width: 90px; height: 90px;
  border-radius: 22px; display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900; color: #fff;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
}
.modal .m-close {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
  background: rgba(0,0,0,.4); color: #fff; font-size: 16px; cursor: pointer;
  backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
}

.modal .m-body { padding: 24px; }
.modal .m-body h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.modal .m-body h2 .en { font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; }
.modal .m-body .sub { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.modal .m-body .desc { font-size: 14px; line-height: 1.7; color: var(--text); opacity: .85; margin-bottom: 8px; }

.modal .section-title {
  font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: .08em; margin: 20px 0 10px;
}
.modal .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.model-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; transition: border-color .2s;
}
.model-card:hover { border-color: var(--accent); }
.model-card .mname { font-weight: 700; font-size: 14px; }
.model-card .mtype { font-size: 11px; color: var(--muted); margin-top: 2px; }
.model-card .mprice { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }

.modal .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.spec-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.spec-item .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.spec-item .val { font-size: 16px; font-weight: 700; margin-top: 3px; }
.modal .m-cta { display: block; width: 100%; padding: 14px; margin-top: 20px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity .2s, box-shadow .2s; text-align: center;
}
.modal .m-cta:hover { opacity: .9; box-shadow: 0 0 24px rgba(0,166,255,.3); }

.empty-state { text-align: center; padding: 80px 20px; }
.empty-state .icon { font-size: 64px; display: block; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; margin-bottom: 6px; }
.empty-state p { color: var(--muted); }

.footer { text-align: center; padding: 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@media (max-width: 640px) {
  .hero { padding: 50px 16px 40px; }
  .hero-stats { gap: 24px; }
  .grid { grid-template-columns: 1fr; }
  .main-wrap { padding: 0 12px 40px; }
  .sticky-bar { padding: 10px 10px; gap: 6px; }
  .modal .model-grid { grid-template-columns: 1fr; }
  .modal .m-hero { height: 170px; }
}
</style>
</head>

let filters = { country:'all', type:'all', price:'all' };
let sort = 'default';

// --- Filter buttons ---
document.querySelectorAll('.fbtn').forEach(b => {
  b.addEventListener('click', () => {
    const k = b.dataset.k, v = b.dataset.v;
    // Toggle
    if (filters[k] === v && v !== 'all') {
      filters[k] = 'all';
    } else {
      filters[k] = v;
    }
    // Update active states
    document.querySelectorAll(`.fbtn[data-k="${k}"]`).forEach(btn => {
      btn.classList.toggle('on', btn.dataset.v === filters[k]);
    });
    render();
  });
});

// --- Sort buttons ---
document.querySelectorAll('.sbtn').forEach(b => {
  b.addEventListener('click', () => {
    sort = b.dataset.s;
    document.querySelectorAll('.sbtn').forEach(bb => bb.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});

// --- Tag colors ---
const tagClass = {
  '新能源':'ev', '轿车':'sedan', 'SUV':'suv', '性能车':'perf', '皮卡':'pickup'
};

// --- Render ---
function render() {
  const query = (document.getElementById('search').value || '').toLowerCase();

  let list = brands.filter(c => {
    if (filters.country!=='all' && c.country!==filters.country) return false;
    if (filters.type!=='all' && !c.types.includes(filters.type)) return false;
    if (filters.price!=='all') {
      const p = filters.price;
      if (p==='0-15万' && c.pMin>=15) return false;
      if (p==='10-20万' && (c.pMax<10 || c.pMin>20)) return false;
      if (p==='20-35万' && (c.pMax<20 || c.pMin>35)) return false;
      if (p==='35-60万' && (c.pMax<35 || c.pMin>60)) return false;
      if (p==='60万+' && c.pMax<60) return false;
    }
    if (query && !c.name.includes(query) && !c.en.toLowerCase().includes(query) && !c.models.some(m=>m.name.includes(query)) && !c.types.some(t=>t.includes(query))) return false;
    return true;
  });

  if (sort==='price-asc') list.sort((a,b)=>a.pMin-b.pMin);
  if (sort==='price-desc') list.sort((a,b)=>b.pMin-a.pMin);

  document.getElementById('count').textContent = list.length;

  const grid = document.getElementById('grid');
  if (list.length===0) {
    grid.innerHTML = '<div class="empty-state"><span class="icon">🔍</span><h3>没有匹配结果</h3><p>试试调整筛选条件或搜索关键词</p></div>';
    return;
  }

  grid.innerHTML = list.map(c => `
    <div class="card" onclick="openModal('${c.id}')">
      <div class="card-header" style="background:linear-gradient(135deg,${c.logoColor}22,${c.logoColor}08)">
        <div class="bg-pattern"></div>
        <div class="logo-placeholder" style="background:linear-gradient(135deg,${c.logoColor},${c.logoColor}dd)">${c.logo}</div>
        <span class="country-chip">${c.country}</span>
      </div>
      <div class="card-body">
        <div class="name-row"><h3>${c.name}</h3><span class="en-name">${c.en}</span></div>
        <div class="price-line">${c.price}</div>
        <div class="model-chips">${c.models.map(m=>`<span class="mchip">${m.name.split(' ')[0]}</span>`).join('')}</div>
        <div class="type-tags">${c.types.map(t=>`<span class="ttag ${tagClass[t]||''}">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

// --- Modal ---
function openModal(id) {
  const c = brands.find(b=>b.id===id); if (!c) return;
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div class="modal">
      <div class="m-hero" style="background:linear-gradient(135deg,${c.logoColor}33,${c.logoColor}11)">
        <div class="m-logo" style="background:linear-gradient(135deg,${c.logoColor},${c.logoColor}dd)">${c.logo}</div>
        <button class="m-close" onclick="closeModal()">✕</button>
      </div>
      <div class="m-body">
        <h2>${c.name}<span class="en">${c.en}</span></h2>
        <p class="sub">${c.country} · ${c.types.join(' / ')}</p>
        <p class="desc">${c.desc}</p>
        <div class="specs">
          <div class="spec-item"><div class="lbl">价格区间</div><div class="val">${c.price}</div></div>
          <div class="spec-item"><div class="lbl">马力</div><div class="val">${c.hp}</div></div>
          <div class="spec-item"><div class="lbl">能源类型</div><div class="val">${c.fuel}</div></div>
          <div class="spec-item"><div class="lbl">车型数量</div><div class="val">${c.models.length}+ 款</div></div>
        </div>
        <div class="section-title">🔥 热门车型</div>
        <div class="model-grid">
          ${c.models.map(m => `
            <div class="model-card">
              <div class="mname">${m.name}${m.ev?' ⚡':''}</div>
              <div class="mtype">${m.type}</div>
              <div class="mprice">${m.price}</div>
            </div>
          `).join('')}
        </div>
        <button class="m-cta" onclick="closeModal()">关闭</button>
      </div>
    </div>
  `;
  m.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
window.openModal = openModal;
window.closeModal = closeModal;

render();
</script>
