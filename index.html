<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌选车 — 找到你的理想座驾</title>
<style>
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --accent: #2563eb;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Hero */
.hero {
  background: linear-gradient(160deg, #0f172a 0%, #1e293b 40%, #1e3a5f 100%);
  color: #fff; text-align: center; padding: 60px 24px 48px;
  position: relative; overflow: hidden;
}
.hero::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at 30% 50%, rgba(37,99,235,.15) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 20%, rgba(239,68,68,.1) 0%, transparent 50%);
}
.hero h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 800; position: relative; z-index: 1; letter-spacing: -.02em; }
.hero p { font-size: 16px; color: rgba(255,255,255,.6); margin-top: 8px; position: relative; z-index: 1; }
.hero .stats { display: flex; gap: 32px; justify-content: center; margin-top: 24px; position: relative; z-index: 1; }
.hero .stat { text-align: center; }
.hero .stat-val { font-size: 28px; font-weight: 700; }
.hero .stat-label { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 2px; }

/* Search */
.search-wrap { max-width: 480px; margin: -20px auto 0; padding: 0 24px; position: relative; z-index: 20; }
.search-box {
  width: 100%; padding: 14px 20px 14px 48px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--card); font-size: 15px; outline: none; box-shadow: 0 4px 20px rgba(0,0,0,.08);
  transition: box-shadow .2s;
}
.search-box:focus { box-shadow: 0 4px 24px rgba(37,99,235,.15); border-color: var(--accent); }
.search-icon { position: absolute; left: 40px; top: 14px; color: var(--muted); font-size: 18px; pointer-events: none; }

/* Filter bar */
.filter-bar {
  display: flex; gap: 10px; padding: 24px; flex-wrap: wrap; justify-content: center;
  position: sticky; top: 0; z-index: 10; background: rgba(248,249,250,.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent; transition: border-color .3s;
}
.filter-bar.scrolled { border-bottom-color: var(--border); }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
.filter-btn {
  padding: 7px 15px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--card); font-size: 13px; cursor: pointer; transition: all .2s;
  white-space: nowrap; color: var(--text); font-weight: 500;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.3); }

/* Sort */
.sort-bar {
  max-width: 1300px; margin: 0 auto; padding: 0 24px 8px;
  display: flex; justify-content: flex-end; gap: 8px;
}
.sort-btn { font-size: 12px; padding: 6px 12px; border: none; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
.sort-btn:hover { background: #e5e7eb; }
.sort-btn.active { color: var(--accent); font-weight: 600; }

/* Grid */
.grid-wrap { max-width: 1300px; margin: 0 auto; padding: 0 24px 48px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 20px;
}
.card {
  background: var(--card); border-radius: 20px; overflow: hidden; cursor: pointer;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  border: 1px solid var(--border); position: relative;
  animation: fadeUp .5s ease both;
}
.card:nth-child(1) { animation-delay: 0s; }
.card:nth-child(2) { animation-delay: .04s; }
.card:nth-child(3) { animation-delay: .08s; }
.card:nth-child(4) { animation-delay: .12s; }
.card:nth-child(5) { animation-delay: .16s; }
.card:nth-child(6) { animation-delay: .2s; }
.card:nth-child(7) { animation-delay: .24s; }
.card:nth-child(8) { animation-delay: .28s; }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
.card-img {
  height: 200px; background-size: cover; background-position: center;
  position: relative; transition: transform .6s;
}
.card:hover .card-img { transform: scale(1.05); }
.card-img .country-badge {
  position: absolute; top: 14px; right: 14px;
  background: rgba(0,0,0,.55); color: #fff; padding: 5px 12px;
  border-radius: 20px; font-size: 11px; font-weight: 600;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.card-img .price-tag {
  position: absolute; bottom: 14px; left: 14px;
  background: rgba(0,0,0,.7); color: #fff; padding: 5px 12px;
  border-radius: 8px; font-size: 14px; font-weight: 700;
  backdrop-filter: blur(8px);
}
.card-body { padding: 18px 20px 20px; }
.card-body .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.card-body h3 { font-size: 17px; font-weight: 700; }
.card-body .models { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card-body .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 4px 10px; border-radius: 8px; font-size: 11px; background: #f1f5f9; color: #475569; font-weight: 500; }

/* Modal */
.modal-overlay {
  position: fixed; inset:0; background: rgba(15,23,42,.6); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:24px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal {
  background: var(--card); border-radius: 24px; max-width: 520px; width: 100%;
  max-height: 88vh; overflow-y: auto; animation: modalIn .3s ease;
}
@keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
.modal .hero-img { height: 260px; background-size: cover; background-position: center; position: relative; }
.modal .hero-img .back-btn {
  position: absolute; top: 16px; left: 16px; width: 36px; height: 36px;
  border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; border: none;
  font-size: 18px; cursor: pointer; backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
.modal-body { padding: 24px; }
.modal-body h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.modal-body .sub { font-size: 14px; color: var(--muted); margin: 4px 0 16px; }
.modal-body .desc { font-size: 15px; line-height: 1.7; color: #374151; margin-bottom: 20px; }
.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spec-item { background: #f8fafc; border-radius: 14px; padding: 16px; }
.spec-item .lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.spec-item .val { font-size: 17px; font-weight: 700; margin-top: 4px; }
.modal-body .cta {
  display: block; width: 100%; padding: 15px; margin-top: 22px;
  background: #0f172a; color: #fff; border: none; border-radius: 16px;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity .2s;
}
.modal-body .cta:hover { opacity: .88; }

.empty-state { text-align: center; padding: 80px 20px; }
.empty-state .icon { font-size: 72px; margin-bottom: 16px; display: block; }
.empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
.empty-state p { color: var(--muted); }

/* Footer */
.footer { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }

/* Skeleton loader */
.skeleton { background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

@media (max-width: 640px) {
  .hero { padding: 40px 20px 36px; }
  .hero .stats { gap: 20px; }
  .hero .stat-val { font-size: 22px; }
  .filter-bar { padding: 14px 10px; gap: 8px; }
  .grid { grid-template-columns: 1fr; }
  .grid-wrap { padding: 0 12px 36px; }
  .modal .hero-img { height: 200px; }
  .sort-bar { padding: 0 12px 8px; }
}
</style>
</head>

let filters = { country:'all', type:'all', price:'all' };
let sort = 'default';
let search = '';

const filterDefs = {
  country: { label:'国别', opts: ['all','中国','德国','日本','美国','韩国','瑞典','英国'] },
  type:    { label:'类型', opts: ['all','轿车','SUV','新能源','性能车','皮卡'] },
  price:   { label:'价位', opts: ['all','0-15万','15-25万','25-50万','50万+'] },
};

// Filter bar scroll shadow
window.addEventListener('scroll', () => {
  document.getElementById('filterBar').classList.toggle('scrolled', window.scrollY > 10);
});

function initFilters() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = Object.entries(filterDefs).map(([key, def]) => `
    <div class="filter-group">
      <span class="filter-label">${def.label}</span>
      ${def.opts.map(o => {
        const label = o==='all' ? '全部' : o;
        const active = filters[key]===o ? ' active' : '';
        return `<button class="filter-btn${active}" data-key="${key}" data-val="${o}">${label}</button>`;
      }).join('')}
    </div>
  `).join('');

  // Event delegation
  bar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.key, v = btn.dataset.val;
      filters[k] = v;
      initFilters();
      renderCars();
    });
  });
}

function setSort(mode) {
  sort = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[onclick="setSort('${mode}')"]`)?.classList.add('active');
  renderCars();
}

// Image error fallback
function imgFallback(el, brand) {
  const colors = {
    '中国':'linear-gradient(135deg,#ff6b35,#f7931e)',
    '德国':'linear-gradient(135deg,#1a1a2e,#16213e)',
    '日本':'linear-gradient(135deg,#e63946,#c9184a)',
    '美国':'linear-gradient(135deg,#003049,#023e8a)',
    '韩国':'linear-gradient(135deg,#2d6a4f,#40916c)',
    '瑞典':'linear-gradient(135deg,#1e3a5f,#3273a8)',
    '英国':'linear-gradient(135deg,#0b3d2e,#1b5e20)',
  };
  el.style.backgroundImage = colors[brand.country] || 'linear-gradient(135deg,#374151,#1f2937)';
}

function renderCars() {
  const query = (document.getElementById('search').value || '').toLowerCase();

  let filtered = brands.filter(c => {
    if (filters.country!=='all' && c.country!==filters.country) return false;
    if (filters.type!=='all' && !c.types.includes(filters.type)) return false;
    if (filters.price!=='all') {
      const [lo, hi] = filters.price.replace('万+','-999').replace('万','').split('-').map(Number);
      if (c.pMax < lo || c.pMin > hi) return false;
    }
    if (query && !c.name.includes(query) && !c.models.includes(query) && !c.types.some(t=>t.includes(query)) && !c.country.includes(query)) return false;
    return true;
  });

  if (sort==='price-asc') filtered.sort((a,b) => a.pMin - b.pMin);
  if (sort==='price-desc') filtered.sort((a,b) => b.pMin - a.pMin);

  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('brandCount').textContent = brands.length;

  const grid = document.getElementById('grid');
  if (filtered.length===0) {
    grid.innerHTML = `<div class="empty-state"><span class="icon">🔍</span><h3>没有匹配结果</h3><p>试试调整筛选条件或搜索关键词</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="card" onclick="openModal('${c.id}')">
      <div class="card-img" style="background-image:url('${c.img}')" onerror="imgFallback(this, {country:'${c.country}'})">
        <span class="country-badge">${c.country}</span>
        <span class="price-tag">${c.price}</span>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="brand-logo" style="background:${c.color}">${c.logo}</div>
          <h3>${c.name}</h3>
        </div>
        <div class="models">${c.models}</div>
        <div class="tags">${c.types.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const c = brands.find(b=>b.id===id); if (!c) return;
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal">
      <div class="hero-img" style="background-image:url('${c.img}')" onerror="this.style.backgroundImage='linear-gradient(135deg,#1e293b,#334155)'">
        <button class="back-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <h2>${c.name}</h2>
        <p class="sub">${c.country} · ${c.types.join(' / ')}</p>
        <p class="desc">${c.desc}</p>
        <div class="specs">
          <div class="spec-item"><div class="lbl">价格区间</div><div class="val">${c.price}</div></div>
          <div class="spec-item"><div class="lbl">马力范围</div><div class="val">${c.hp}</div></div>
          <div class="spec-item"><div class="lbl">能源类型</div><div class="val">${c.fuel}</div></div>
          <div class="spec-item"><div class="lbl">热门车型</div><div class="val">${c.models}</div></div>
        </div>
        <button class="cta" onclick="closeModal()">关闭</button>
      </div>
    </div>
  `;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target===this) closeModal();
});

document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

window.openModal = openModal;
window.closeModal = closeModal;
window.setSort = setSort;

initFilters();
renderCars();
</script>
</body>
</html>
