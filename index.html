<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>品牌选车</title>
<style>
:root {
  --c-white: #fff;
  --c-bg: #f4f6f7;
  --c-text: #24252c;
  --c-text2: #646464;
  --c-text3: #adadad;
  --c-border: #eee;
  --c-placeholder: #d8d8d8;
  --c-error: #ff4b40;
  --shadow: 0 0 20px 0 rgba(0,0,0,.07);
  --radius: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: var(--c-white); color: var(--c-text);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* 顶部导航风格 — 极简白底 */
.topbar {
  position: sticky; top:0; z-index:100; background: var(--c-white);
  border-bottom: 1px solid var(--c-border); padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.topbar .logo { font-size: 18px; font-weight: 700; color: var(--c-text); letter-spacing: -.01em; }
.topbar .logo span { font-weight: 400; color: var(--c-text3); margin-left: 6px; font-size: 13px; }
.topbar nav { display: flex; gap: 24px; }
.topbar nav a { font-size: 14px; color: var(--c-text2); text-decoration: none; transition: color .15s; font-weight: 500; }
.topbar nav a:hover { color: var(--c-text); }

/* 大图Hero — 全幅汽车图 */
.hero {
  position: relative; width: 100%; height: 420px; overflow: hidden;
  display: flex; align-items: flex-end; padding: 48px;
  background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
}
.hero .hero-text { position: relative; z-index: 1; }
.hero h1 { font-size: 40px; font-weight: 700; color: #fff; letter-spacing: -.02em; line-height: 1.2; }
.hero p { font-size: 15px; color: rgba(255,255,255,.55); margin-top: 8px; max-width: 480px; line-height: 1.6; }

/* 筛选项 — 极简标签 */
.filters-wrap {
  position: sticky; top: 56px; z-index: 50; background: rgba(255,255,255,.92);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--c-border); padding: 14px 20px;
  display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
}
.filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filter-row .fl { font-size: 12px; font-weight: 600; color: var(--c-text3); margin-right: 4px; }
.fbtn {
  padding: 6px 14px; border: none; border-radius: 20px;
  background: var(--c-bg); color: var(--c-text2); font-size: 13px;
  cursor: pointer; transition: all .15s; font-weight: 500; font-family: inherit;
}
.fbtn:hover { background: #e8eaec; color: var(--c-text); }
.fbtn.on { background: var(--c-text); color: var(--c-white); }

/* 搜索 */
.search-row { padding: 0 20px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.search-row .count { font-size: 13px; color: var(--c-text3); margin-right: auto; }
.search-row .count b { color: var(--c-text); font-weight: 600; }
.search-input {
  padding: 8px 14px; border: 1px solid var(--c-border); border-radius: 20px;
  font-size: 13px; outline: none; width: 200px; transition: border-color .15s;
  font-family: inherit; background: var(--c-bg); color: var(--c-text);
}
.search-input::placeholder { color: var(--c-placeholder); }
.search-input:focus { border-color: var(--c-text2); background: var(--c-white); }
.sort-btn { font-size: 12px; padding: 6px 12px; border: none; background: none; color: var(--c-text3); cursor: pointer; border-radius: 6px; font-family: inherit; font-weight: 500; }
.sort-btn:hover { color: var(--c-text); }
.sort-btn.on { color: var(--c-text); font-weight: 600; background: var(--c-bg); }

/* 内容区 */
.main-wrap { max-width: 2560px; margin: 0 auto; padding: 30px 20px 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }

/* 卡片 — 影视飓风风格：大图 + 简洁信息 */
.card {
  background: var(--c-white); border-radius: var(--radius); overflow: hidden;
  cursor: pointer; transition: box-shadow .3s, transform .3s;
  box-shadow: var(--shadow); border: 1px solid var(--c-border);
}
.card:hover { box-shadow: 0 4px 30px 0 rgba(0,0,0,.1); transform: translateY(-2px); }
.card .img-area {
  height: 220px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background-size: cover; background-position: center;
}
.card .img-area .img-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.15);
  transition: background .3s;
}
.card:hover .img-area .img-overlay { background: rgba(0,0,0,.08); }
.card .img-area .brand-icon {
  width: 72px; height: 72px; border-radius: 18px; display: flex;
  align-items: center; justify-content: center; font-size: 26px;
  font-weight: 800; color: #fff; position: relative; z-index: 1;
  box-shadow: 0 8px 30px rgba(0,0,0,.3);
}
.card .info { padding: 20px; }
.card .info .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card .info .brand h3 { font-size: 18px; font-weight: 600; }
.card .info .brand .en { font-size: 12px; color: var(--c-text3); text-transform: uppercase; }
.card .info .price { font-size: 15px; font-weight: 600; color: var(--c-text); margin-bottom: 8px; }
.card .info .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.card .info .tag {
  padding: 3px 10px; border-radius: 4px; font-size: 11px;
  background: var(--c-bg); color: var(--c-text2); font-weight: 500;
}
.card .info .models-row { display: flex; gap: 4px; flex-wrap: wrap; }
.card .info .models-row span {
  font-size: 11px; color: var(--c-text3); padding: 2px 6px;
  background: var(--c-bg); border-radius: 4px;
}

/* 弹窗 */
.overlay {
  position: fixed; inset:0; background: rgba(0,0,0,.45); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal {
  background: var(--c-white); border-radius: 20px; max-width: 520px; width:100%;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15);
  animation: modIn .25s ease;
}
@keyframes modIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.modal .m-img { height:200px; display:flex; align-items:center; justify-content:center; position:relative; }
.modal .m-img .m-logo { width:80px; height:80px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#fff; }
.modal .m-img .m-close { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.2); border:none; color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal .m-body { padding: 24px; }
.modal .m-body h2 { font-size: 24px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.modal .m-body h2 .en { font-size: 13px; color: var(--c-text3); font-weight: 400; }
.modal .m-body .sub { font-size: 13px; color: var(--c-text2); margin: 6px 0 14px; }
.modal .m-body .desc { font-size: 14px; color: var(--c-text2); line-height: 1.7; margin-bottom: 20px; }
.modal .m-body .sec { font-size: 12px; font-weight: 600; color: var(--c-text); margin-bottom: 10px; }
.modal .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.mcard { background: var(--c-bg); border-radius: 10px; padding: 14px; }
.mcard .mn { font-size: 14px; font-weight: 600; }
.mcard .mt { font-size: 11px; color: var(--c-text3); margin-top: 2px; }
.mcard .mp { font-size: 13px; font-weight: 600; color: var(--c-text); margin-top: 4px; }
.modal .spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.sbox { background: var(--c-bg); border-radius: 10px; padding: 14px; }
.sbox .sl { font-size: 11px; color: var(--c-text3); }
.sbox .sv { font-size: 15px; font-weight: 600; margin-top: 3px; }
.modal .m-btn { display: block; width: 100%; padding: 14px; background: var(--c-text); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; }
.modal .m-btn:hover { opacity: .85; }

.empty { text-align: center; padding: 80px 20px; }
.empty .icon { font-size: 56px; margin-bottom: 14px; display: block; }
.empty h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty p { color: var(--c-text3); font-size: 14px; }

.footer { text-align: center; padding: 30px 20px; color: var(--c-text3); font-size: 12px; border-top: 1px solid var(--c-border); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 2px; }

@media (max-width: 768px) {
  .hero { height: 280px; padding: 30px 20px; }
  .hero h1 { font-size: 28px; }
  .grid { grid-template-columns: 1fr; }
  .main-wrap { padding: 20px 12px 60px; }
  .filters-wrap { padding: 10px 12px; gap: 14px; }
  .topbar { padding: 0 12px; }
  .topbar nav { gap: 14px; }
}
</style>

let filters = { country:'all', type:'all', price:'all' }, sort = 'default';

// Filters
const fDefs = {
  country: { label:'国别', opts:['all','中国','德国','日本','美国','韩国','瑞典','英国'] },
  type: { label:'类型', opts:['all','轿车','SUV','新能源','性能车','皮卡'] },
  price: { label:'价格', opts:['all','0-15万','10-20万','20-35万','35-60万','60万+'] },
};

(function initFilters() {
  const bar = document.getElementById('filters');
  bar.innerHTML = Object.entries(fDefs).map(([k,d]) => `
    <div class="filter-row">
      <span class="fl">${d.label}</span>
      ${d.opts.map(o => `<button class="fbtn${filters[k]===o?' on':''}" data-k="${k}" data-v="${o}">${o==='all'?'全部':o}</button>`).join('')}
    </div>
  `).join('');
  bar.querySelectorAll('.fbtn').forEach(b => {
    b.addEventListener('click', () => {
      const k = b.dataset.k, v = b.dataset.v;
      filters[k] = v;
      initFilters(); render();
    });
  });
})();

// Sort
document.querySelectorAll('.sort-btn').forEach(b => {
  b.addEventListener('click', () => {
    sort = b.dataset.s;
    document.querySelectorAll('.sort-btn').forEach(bb => bb.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  let list = brands.filter(c => {
    if (filters.country!=='all' && c.country!==filters.country) return false;
    if (filters.type!=='all' && !c.types.includes(filters.type)) return false;
    if (filters.price!=='all') {
      const p = filters.price;
      if (p==='0-15万' && c.pMin>=15) return false;
      if (p==='10-20万' && (c.pMax<10 || c.pMin>20)) return false;
      if (p==='20-35万' && (c.pMax<20 || c.pMin>35)) return false;
      if (p==='35-60万' && (c.pMax<35 || c.pMin>60)) return false;
      if (p==='60万+' && c.pMax<60) return false;
    }
    if (q && !c.name.includes(q) && !c.en.toLowerCase().includes(q) && !c.models.some(m=>m.n.includes(q))) return false;
    return true;
  });
  if (sort==='price-asc') list.sort((a,b)=>a.pMin-b.pMin);
  if (sort==='price-desc') list.sort((a,b)=>b.pMin-a.pMin);
  document.getElementById('count').textContent = list.length;
  const grid = document.getElementById('grid');
  if (list.length===0) {
    grid.innerHTML = '<div class="empty"><span class="icon">🔍</span><h3>没有匹配结果</h3><p>试试调整筛选条件或搜索关键词</p></div>';
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="card" onclick="openModal('${c.id}')">
      <div class="img-area" style="background-image:url('images/${c.id}-1.jpg')">
        <div class="img-overlay"></div>
        <div class="brand-icon" style="background:linear-gradient(135deg,${c.lc},${c.lc}dd)">${c.logo}</div>
      </div>
      <div class="info">
        <div class="brand"><h3>${c.name}</h3><span class="en">${c.en}</span></div>
        <div class="price">${c.price}</div>
        <div class="tags">${c.types.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="models-row">${c.models.map(m=>`<span>${m.n.split(' ')[0]}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

// Modal
function openModal(id) {
  const c = brands.find(b=>b.id===id); if (!c) return;
  document.getElementById('modal').innerHTML = `
    <div class="modal">
      <div class="m-img" style="background-image:url('images/${c.id}-1.jpg');background-size:cover;background-position:center">
        <div class="m-logo" style="background:linear-gradient(135deg,${c.lc},${c.lc}dd)">${c.logo}</div>
        <button class="m-close" onclick="closeModal()">✕</button>
      </div>
      <div class="m-body">
        <h2>${c.name}<span class="en">${c.en}</span></h2>
        <p class="sub">${c.country} · ${c.types.join(' / ')}</p>
        <p class="desc">${c.desc}</p>
        <div class="spec-row">
          <div class="sbox"><div class="sl">价格区间</div><div class="sv">${c.price}</div></div>
          <div class="sbox"><div class="sl">动力范围</div><div class="sv">${c.hp}</div></div>
          <div class="sbox"><div class="sl">能源类型</div><div class="sv">${c.fuel}</div></div>
          <div class="sbox"><div class="sl">热门车型</div><div class="sv">${c.models.length}+ 款</div></div>
        </div>
        <div class="sec">热门车型</div>
        <div class="m-grid">${c.models.map(m=>`<div class="mcard"><div class="mn">${m.n}${m.ev?' ⚡':''}</div><div class="mt">${m.t}</div><div class="mp">${m.p}</div></div>`).join('')}</div>
        <button class="m-btn" onclick="closeModal()">关闭</button>
      </div>
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
}
document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
window.openModal = openModal;
window.closeModal = closeModal;

render();
</script>
